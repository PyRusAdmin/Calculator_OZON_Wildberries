<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор OZON / Wildberries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-badge">
                <span class="badge ozon">OZON</span>
                <span class="badge wb">WB</span>
            </div>
            <h1>Калькулятор маркетплейсов</h1>
            <p class="subtitle">Расчёт юнитономики, комиссии, логистики и итоговой цены для Ozon и Wildberries</p>
        </header>

        <main class="main-content">
            <form id="calculatorForm" class="calc-form">
                <div class="grid-layout">
                    <!-- Блок 1: Себестоимость -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">💰</div>
                            <h2>Себестоимость</h2>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="purchasePrice">Закупочная цена (₽)</label>
                                <input type="number" id="purchasePrice" name="purchase_price" value="210" required step="0.01" placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label for="costExtra">Доп. расходы к закупке (₽)</label>
                                <input type="number" id="costExtra" name="cost_extra" value="85" step="0.01" placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label for="marginPercent">Наценка к себестоимости (%)</label>
                                <input type="number" id="marginPercent" name="margin_percent" value="20" step="0.1" placeholder="0">
                            </div>
                        </div>
                    </div>

                    <!-- Блок 2: Параметры маркетплейса -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">🏪</div>
                            <h2>Параметры маркетплейса</h2>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="marketplace">Площадка</label>
                                <select id="marketplace" name="marketplace">
                                    <option value="ozon" selected>Ozon</option>
                                    <option value="wb">Wildberries</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="scheme">Схема работы</label>
                                <select id="scheme" name="scheme">
                                    <option value="FBS" selected>FBS (со своего склада)</option>
                                    <option value="FBO">FBO (со склада маркетплейса)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="category">Категория товара</label>
                                <input type="text" id="category" name="category" value="Велокамера" placeholder="Введите категорию">
                            </div>
                        </div>
                    </div>

                    <!-- Блок 3: Логистика и доставка -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">🚚</div>
                            <h2>Логистика и доставка</h2>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="logistics">Логистика (₽)</label>
                                <input type="number" id="logistics" name="logistics" value="93" step="0.01" placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label for="delivery">Доставка до ПВЗ (₽)</label>
                                <input type="number" id="delivery" name="delivery" value="25" step="0.01" placeholder="0.00">
                            </div>
                            <div class="form-group" id="handlingGroup">
                                <label id="handlingLabel" for="handling">Обработка отправления (₽)</label>
                                <input type="number" id="handling" name="handling" value="10" step="0.01" placeholder="0.00">
                            </div>
                        </div>
                    </div>

                    <!-- Блок 4: Комиссии и надбавки -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">📊</div>
                            <h2>Комиссии и надбавки</h2>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="acquiring">Эквайринг (%)</label>
                                <input type="number" id="acquiring" name="acquiring" value="1.0" step="0.1" placeholder="0.0">
                            </div>
                            <div class="form-group">
                                <label for="markup1">Надбавка 1 (%)</label>
                                <input type="number" id="markup1" name="markup_1" value="8" step="0.1" placeholder="0.0">
                            </div>
                            <div class="form-group">
                                <label for="markup2">Надбавка 2 (%)</label>
                                <input type="number" id="markup2" name="markup_2" value="5" step="0.1" placeholder="0.0">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-bar">
                    <button type="submit" class="btn btn-primary">
                        <span>🧮</span> Рассчитать цену
                    </button>
                </div>
            </form>

            <!-- Результаты расчёта -->
            <div id="resultsCard" class="card result-card hidden">
                <div class="card-header">
                    <div class="card-icon">🎯</div>
                    <h2>Результаты расчёта</h2>
                </div>
                <div class="card-body">
                    <div id="resultContent" class="result-grid">
                        <!-- Результаты подставляются через JS -->
                    </div>
                </div>
            </div>

            <!-- Блок массового расчёта -->
            <div class="card file-card">
                <div class="card-header">
                    <div class="card-icon">📁</div>
                    <h2>Массовый пересчёт прайса (Excel)</h2>
                </div>
                <div class="card-body">
                    <form id="fileCalcForm" enctype="multipart/form-data" class="file-form">
                        <div class="file-dropzone">
                            <input type="file" id="excelFile" name="file" accept=".xlsx,.xls" required>
                            <label for="excelFile" class="file-label">
                                <span class="file-icon">📄</span>
                                <span class="file-text">Выберите файл Excel (.xlsx)</span>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-secondary">
                            <span>🚀</span> Загрузить и пересчитать
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
